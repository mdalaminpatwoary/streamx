<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment status · StreamX</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#0a0d1a;--card:#10142a;--line:#1f2542;--mut:#98a1bc;--ac:#ed3124}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,rgba(237,49,36,.12),transparent),var(--bg);color:#fff;font-family:Manrope,system-ui,sans-serif}
.box{width:100%;max-width:460px;padding:36px 30px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px}
.ic{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;font-size:34px}
.ok .ic{background:rgba(34,197,94,.15);color:#22c55e}.bad .ic{background:rgba(237,49,36,.15);color:var(--ac)}.wait .ic{background:rgba(255,255,255,.08);color:#fff}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 6px;color:var(--mut);line-height:1.6}
.ref{margin:20px 0;padding:14px;text-align:left;font-size:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;display:grid;gap:6px}
.ref div{display:flex;justify-content:space-between;gap:12px;color:var(--mut)}.ref b{color:#fff;font-weight:600;text-align:right;word-break:break-word}
.btn{display:block;margin-top:12px;padding:14px;border-radius:14px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(90deg,#ED3124,#FF4F3F)}
.btn.alt{background:transparent;border:1px solid var(--line)}
.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="box wait" id="box" aria-live="polite">
  <div class="ic" id="ic"><span class="spin">◐</span></div>
  <h1 id="h">Checking your payment…</h1>
  <p id="p">Please wait a moment. Do not close this page.</p>
  <div class="ref" id="ref" hidden></div>
  <div id="acts"></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),t=q.get("t")||"",s=q.get("s")||"",WA="8801312850241";
  var box=document.getElementById("box"),ic=document.getElementById("ic"),h=document.getElementById("h"),p=document.getElementById("p"),ref=document.getElementById("ref"),acts=document.getElementById("acts");
  function wa(msg){return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg)}
  function row(k,v){return v?'<div><span>'+k+'</span><b>'+String(v).replace(/[<>&]/g,"")+'</b></div>':""}
  function show(kind,icon,title,text){box.className="box "+kind;ic.textContent=icon;h.textContent=title;p.textContent=text}
  function done(d){
    ref.hidden=false;ref.innerHTML=row("Order reference",d.reference||t)+row("Amount",d.amount?"৳"+d.amount:"")+row("Paid with",d.method)+row("Transaction ID",d.epsTransactionId);
    acts.innerHTML='<a class="btn" target="_blank" rel="noopener" href="'+wa("Hi StreamX! I paid online. Order ref: "+(d.reference||t)+(d.epsTransactionId?", Transaction ID: "+d.epsTransactionId:"")+". Please deliver my order.")+'">Send order details on WhatsApp (optional)</a><a class="btn alt" href="./">Back to StreamX</a>';
  }
  if(!/^\d{10,24}$/.test(t)){show("bad","!","Nothing to show","This page opens after a payment. Go back to the shop to place an order.");acts.innerHTML='<a class="btn" href="./">Back to StreamX</a>';return}
  if(s==="cancel"){show("bad","✕","Payment cancelled","No money was taken. Your cart is still saved, so you can try again.");acts.innerHTML='<a class="btn" href="./">Back to cart</a>';return}
  fetch("/api/verify?t="+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){
    var st=String(d.status||"").toLowerCase();
    if(st==="success"){
      try{localStorage.removeItem("sx_cart")}catch(e){}
      show("ok","✓","Payment received","Thank you! Your order is confirmed. We will deliver your subscription shortly. Keep the reference below.");done(d);
    }else if(st==="pending"||st==="processing"||st==="initiated"){
      show("wait","…","Payment is processing","Your bank is still confirming. If money was deducted, send us the reference on WhatsApp.");done(d);
    }else{
      show("bad","✕","Payment not completed","No payment was confirmed. If money was deducted, send us the reference below and we will check right away.");done(d);
    }
  }).catch(function(){
    show("wait","…","Could not check the payment","Please keep this reference and message us on WhatsApp so we can confirm it.");ref.hidden=false;ref.innerHTML=row("Order reference",t);
    acts.innerHTML='<a class="btn" target="_blank" rel="noopener" href="'+wa("Hi StreamX! I tried to pay online. Order ref: "+t)+'">Message us on WhatsApp</a>';
  });
})();
</script>
</body>
</html>
