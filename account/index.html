<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My subscriptions | StreamX</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Sign in to see your StreamX subscriptions, expiry dates and renew in one tap.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/account.css?v=3">
</head>
<body>
<div class="ac-top"><a href="/"><img src="/assets/img/brand/logo.png" alt="StreamX" width="40" height="40"></a><a class="back" href="/">← Back to StreamX</a></div>
<main class="ac-wrap">
  <div class="ac-eyebrow">My account</div>
  <h1>Your subscriptions</h1>
  <p class="ac-sub" id="sub">See what is active, when it ends, and renew in one tap.</p>

  <section id="login" class="ac-card ac-login" hidden>
    <form id="lf" novalidate>
      <label for="em">Email used when ordering</label>
      <input class="ac-in" id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
      <p class="ac-msg" id="lm" role="alert"></p>
      <button class="ac-btn" id="lb" type="submit">Email me a sign-in link</button>
      <p class="ac-note">No password needed. We email you a secure link that works for 20 minutes. Ordered on WhatsApp? Message us and we will add your email.</p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="ac-bar"><span class="ac-who">Signed in as <b id="who"></b></span><button class="ac-btn ac-ghost ac-sm" id="out" type="button">Sign out</button></div>
    <div class="ac-list" id="list"></div>
  </section>
</main>
<script src="/assets/js/data/catalog.js"></script>
<script src="/assets/js/account.js?v=2"></script>
</body>
</html>
